<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Serpiente Pepe | LELUPIXEL Juegos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <h1 class="text-2xl font-bold mb-4">La Serpiente Pepe 🐍</h1>

    <!-- Contenedor del Juego -->
    <div class="relative flex flex-col items-center">
        
        <!-- El Iframe que llama al juego empaquetado de Scratch -->
        <iframe id="game-iframe" src="juego.html" width="480" height="360" class="border-2 border-purple-500 rounded-xl shadow-2xl"></iframe>

        <!-- BOTONES TÁCTILES PARA CELULAR (Abajo del juego) -->
        <div class="mt-6 flex flex-col items-center gap-2 md:hidden">
            <!-- Botón Arriba (W) -->
            <button ontouchstart="sendKey('w')" onmousedown="sendKey('w')" class="bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-bold py-3 px-8 rounded-xl shadow-lg text-lg">
                ⬆️ W (Avanzar)
            </button>
            
            <!-- Botones Izquierda y Derecha (A y D) -->
            <div class="flex gap-4">
                <button ontouchstart="sendKey('a')" onmousedown="sendKey('a')" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg text-lg">
                    ⬅️ A
                </button>
                <button ontouchstart="sendKey('d')" onmousedown="sendKey('d')" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg text-lg">
                    D ➡️
                </button>
            </div>

            <!-- Botón Dash (Espacio) -->
            <button ontouchstart="sendKey(' ')" onmousedown="sendKey(' ')" class="mt-2 bg-pink-600 hover:bg-pink-700 active:bg-pink-800 text-white font-bold py-2.5 px-10 rounded-xl shadow-lg text-base">
                ⚡ DASH (Espacio)
            </button>
        </div>
    </div>

    <!-- Script que convierte los toques de los botones en teclas virtuales -->
    <script>
        function sendKey(keyName) {
            const iframe = document.getElementById('game-iframe');
            if (iframe && iframe.contentWindow) {
                // Simular presionar tecla
                iframe.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: keyName, bubbles: true }));
                // Simular soltar tecla al ratito
                setTimeout(() => {
                    iframe.contentWindow.dispatchEvent(new KeyboardEvent('keyup', { key: keyName, bubbles: true }));
                }, 100);
            }
        }
    </script>
</body>
</html>
